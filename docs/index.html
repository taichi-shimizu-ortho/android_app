<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2196F3">
    <script>
      (function() {
        const hash = window.location.hash;
        const search = window.location.search;
        let appName = 'home';
        if (search.includes('app=msc') || hash.includes('protocol')) appName = 'msc';
        else if (search.includes('app=ihc') || hash.includes('timer')) appName = 'ihc';
        else if (search.includes('app=ish') || hash.includes('ish-palette')) appName = 'ish';
        else if (search.includes('app=prompter') || hash.includes('prompter')) appName = 'prompter';
        
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = `./manifest_${appName}.json`;
        document.head.appendChild(manifestLink);

        const iconLink192 = document.createElement('link');
        iconLink192.rel = 'icon';
        iconLink192.type = 'image/png';
        iconLink192.href = `./icons/${appName}/icon-192.png`;
        document.head.appendChild(iconLink192);

        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = `./icons/${appName}/icon-192.png`;
        document.head.appendChild(appleIcon);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Lab Protocol App</title>
    <script type="module" crossorigin src="./assets/index-lpUVxynN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BqlFYG6o.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
