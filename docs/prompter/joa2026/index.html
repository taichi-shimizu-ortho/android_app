<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>JOA 2026 プロンプター</title>
<!-- Prompter PWA (/android_app/prompter/) の一部として配信する -->
<link rel="manifest" href="/android_app/manifest_prompter.json">
<link rel="icon" type="image/png" href="/android_app/icons/prompter/icon-192.png">
<link rel="apple-touch-icon" href="/android_app/icons/prompter/icon-192.png">
<style>
  :root { color-scheme: dark; --font-size: 30px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #111827; color: #f3f4f6;
    font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
  }
  .app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header { padding: 10px 12px; background: #1f2937; flex: none; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 17px; margin: 0; }
  .back { color: #93c5fd; text-decoration: none; font-size: 14px; white-space: nowrap; }
  button, select, .file-label {
    min-height: 44px; border: 1px solid #4b5563; border-radius: 9px;
    background: #374151; color: white; font-size: 15px;
    padding: 8px 12px; cursor: pointer; touch-action: manipulation;
  }
  button.primary { background: #2563eb; border-color: #60a5fa; font-weight: bold; }
  button:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid #60a5fa; outline-offset: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; align-items: center; }
  .clock { font-variant-numeric: tabular-nums; font-weight: bold; font-size: 20px; }
  .timeline { display: flex; align-items: center; gap: 9px; margin-top: 8px; }
  input[type="range"] { accent-color: #60a5fa; min-height: 32px; min-width: 0; }
  input[type="checkbox"] { accent-color: #60a5fa; width: 20px; height: 20px; }
  #seek { flex: 1; width: 100%; }
  #total { color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .reader-wrap { position: relative; flex: 1; min-height: 0; }
  #reader {
    height: 100%; overflow-y: auto; overscroll-behavior: contain;
    padding: 35vh 16px; scrollbar-width: thin;
  }
  .line {
    font-size: var(--font-size); line-height: 1.65;
    padding: 16px 14px; border-radius: 12px; margin-bottom: 12px;
    color: #9ca3af; overflow-wrap: anywhere; cursor: pointer;
  }
  .line.active { background: #213c60; color: #fff; box-shadow: inset 4px 0 #60a5fa; }
  .line.past { color: #6b7280; }
  .stamp { display: block; font-size: 13px; color: #93c5fd; margin-bottom: 5px; }
  .hint { font-size: 12px; color: #cbd5e1; padding-top: 6px; }
  .toggle { display: flex; gap: 7px; align-items: center; min-height: 44px; font-size: 15px; }
  summary { cursor: pointer; min-height: 36px; padding: 8px 0 0; font-size: 14px; color: #cbd5e1; }
  details[open] .panel { max-height: 45vh; overflow-y: auto; padding-top: 6px; }
  textarea {
    display: block; width: 100%; height: 135px; resize: vertical;
    border: 1px solid #4b5563; border-radius: 8px; background: #111827;
    color: #f3f4f6; padding: 10px; font: 16px/1.5 monospace;
  }
  .editor-buttons { display: flex; flex-wrap: wrap; gap: 7px; margin: 9px 0; }
  .settings { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 14px; margin-bottom: 9px; }
  .settings label { display: flex; gap: 7px; align-items: center; min-height: 36px; }
  #font { width: 100px; }
  #status { font-size: 12px; color: #cbd5e1; margin: 4px 0 0; }
  #status:empty { display: none; }
  #reader.mirror .line, #reader.mirror #blindHint { transform: scaleX(-1); }
  [hidden] { display: none !important; }

  /* 暗記モードでは直前の1行だけを表示する */
  #reader.blind .line { display: none; }
  #reader.blind .line.previous {
    display: block; color: #f3f4f6; background: #263449;
    box-shadow: inset 4px 0 #fbbf24; cursor: default;
  }
  #reader.blind { padding-top: 24px; padding-bottom: 24px; }
  #blindHint {
    font-size: var(--font-size); line-height: 1.65;
    padding: 16px 14px; color: #cbd5e1;
  }
  @media (min-width: 800px) {
    #reader {
      padding-left: max(20px, calc((100% - 900px)/2));
      padding-right: max(20px, calc((100% - 900px)/2));
    }
  }
  @media (max-height: 450px) {
    header { padding: 5px 10px; }
    .controls { margin-top: 4px; }
    .hint { display: none; }
    .line { padding: 8px 12px; margin-bottom: 6px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="top">
      <a class="back" href="/android_app/prompter/#/prompter">← 一覧</a>
      <h1>JOA 2026 プロンプター</h1>
      <button id="fullscreen" aria-label="全画面切り替え">全画面</button>
    </div>
    <div class="controls">
      <button id="play" class="primary">▶ 再生</button>
      <button id="reset">先頭へ</button>
      <button id="back">−10秒</button>
      <label>速度
        <select id="speed" aria-label="再生速度">
          <option value="0.75">0.75倍</option>
          <option value="0.9">0.9倍</option>
          <option value="1" selected>1.0倍</option>
          <option value="1.1">1.1倍</option>
          <option value="1.25">1.25倍</option>
          <option value="1.5">1.5倍</option>
        </select>
      </label>
      <span id="clock" class="clock">00:00</span>
      <label class="toggle"><input id="blind" type="checkbox"> 暗記モード</label>
      <label class="toggle"><input id="tts" type="checkbox"> 🔊 音声</label>
      <button id="speakNow">🔊 今の行</button>
    </div>
    <div class="timeline">
      <input id="seek" type="range" min="0" max="180" step="0.1" value="0" aria-label="読み上げ位置">
      <span id="total">03:00</span>
    </div>
    <details id="editorDetails">
      <summary>⚙ 表示設定・原稿の編集</summary>
      <div class="panel">
        <div class="settings">
          <label>文字 <input id="font" type="range" min="20" max="60" value="30" aria-label="文字サイズ"> <span id="fontValue">30</span></label>
          <label><input id="mirror" type="checkbox"> 左右反転</label>
          <label class="tts-only">端末読み上げの声 <select id="voice" aria-label="端末読み上げの声"><option value="">自動（日本語）</option></select></label>
          <button id="center">表示行へ</button>
        </div>
        <textarea id="source" spellcheck="false" aria-label="LRC原稿"></textarea>
        <div class="editor-buttons">
          <button id="apply" class="primary">原稿を反映</button>
          <label class="file-label" for="file">LRCを開く</label>
          <input id="file" type="file" accept=".lrc,.txt,text/plain" hidden>
          <button id="download">LRCを保存</button>
          <button id="sample">音声付き原稿に戻す</button>
        </div>
        <div class="hint">UTF-8対応。最終行に [03:00.00] のような空の時刻行を置くと、終了時間を指定できます。
          本文を変えると録音済み音声と合わなくなるため、端末の読み上げに切り替わります。</div>
      </div>
    </details>
    <div id="modeHint" class="hint"></div>
    <p id="status" role="status"></p>
  </header>
  <section class="reader-wrap" aria-label="読み上げ原稿">
    <div id="reader"></div>
  </section>
</main>
<script>
"use strict";
// 原稿と音声は tools/lrc_tts.py で作る。LRC の時刻は音声に合わせてある。
const SCRIPT_URL = "joa2026.lrc";
const AUDIO_URL = "audio.mp3";

const $ = id => document.getElementById(id);
const STORAGE = "lrc-prompter-v1";
let entries = [], nodes = [], duration = 180, elapsed = 0;
let playing = false, lastTick = 0, raf = 0, active = -2;
let wake = null, wakePending = false, storageAvailable = true;
let playbackSpeed = 1, blindHint = null;
const speech = "speechSynthesis" in window ? window.speechSynthesis : null;
let spokenIndex = -2, savedVoice = "";
// 録音済み音声：本文が audioScript と同じときは音声の再生位置を時計にする
const audio = new Audio();
let audioScript = "", audioReady = false, useAudio = false, segmentEnd = null;

function saved() {
  try { return JSON.parse(localStorage.getItem(STORAGE) || "{}") || {}; }
  catch { return {}; }
}
function save() {
  try {
    localStorage.setItem(STORAGE, JSON.stringify({
      source: $("source").value, font: $("font").value,
      mirror: $("mirror").checked, speed: $("speed").value,
      blind: $("blind").checked, sound: $("tts").checked,
      voice: $("voice").value || savedVoice
    }));
    storageAvailable = true;
  } catch { storageAvailable = false; }
}
function message(text) { $("status").textContent = text; }
function format(sec) {
  sec = Math.max(0, Math.floor(sec));
  return String(Math.floor(sec / 60)).padStart(2, "0") + ":" +
    String(sec % 60).padStart(2, "0");
}
function parseLrc(text) {
  const result = [];
  const offsetMatch = text.match(/\[offset:\s*(-?\d+)\]/i);
  const offset = offsetMatch ? Number(offsetMatch[1]) / 1000 : 0;
  for (const raw of text.replace(/^﻿/, "").split(/\r?\n/)) {
    const tags = [...raw.matchAll(/\[(\d+):([0-5]?\d)(?:\.(\d{1,3}))?\]/g)];
    if (!tags.length) continue;
    const content = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const tag of tags) {
      const time = Number(tag[1]) * 60 + Number(tag[2]) +
        (tag[3] ? Number("0." + tag[3]) : 0) + offset;
      result.push({ time: Math.max(0, time), text: content });
    }
  }
  return result.sort((a, b) => a.time - b.time);
}
function sameText(a, b) {
  const body = list => list.filter(e => e.text).map(e => e.text).join("\n");
  return body(a) === body(b);
}
function matchesAudio(text) {
  return !!audioScript && sameText(parseLrc(text), parseLrc(audioScript));
}
function visibleIndex() {
  // 終了時には最後の行も読み終えたものとして表示する。
  if ($("blind").checked) {
    return elapsed >= duration ? entries.length - 1 : active - 1;
  }
  return active;
}
function centerLine(smooth = true) {
  const reader = $("reader");
  if ($("blind").checked) {
    // 暗記モードは1行のみ。長文は手動スクロールできる。
    reader.scrollTo({ top: 0, behavior: "auto" });
    return;
  }
  const node = nodes[visibleIndex()];
  if (!node) return;
  reader.scrollTo({
    top: node.offsetTop - reader.clientHeight / 2 + node.offsetHeight / 2,
    behavior: smooth ? "smooth" : "auto"
  });
}
// 読み上げは端末の音声合成（Android では Google TTS）を使う。
// 行が切り替わったら前の発話を止めて新しい行を読むので、タイマーとずれない。
function loadVoices() {
  if (!speech) return;
  const voices = speech.getVoices().filter(v => /^ja\b/i.test(v.lang));
  const select = $("voice");
  const current = select.value || savedVoice;
  select.replaceChildren(new Option("自動（日本語）", ""));
  for (const v of voices) select.add(new Option(v.name, v.name));
  if (voices.some(v => v.name === current)) select.value = current;
}
function speakText(text) {
  if (!speech || !text) return;
  speech.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP";
  utter.rate = playbackSpeed;
  const name = $("voice").value;
  const voices = speech.getVoices();
  utter.voice = voices.find(v => v.name === name) ||
    voices.find(v => /^ja\b/i.test(v.lang) && /google/i.test(v.name)) ||
    voices.find(v => /^ja\b/i.test(v.lang)) || null;
  speech.speak(utter);
}
function stopSpeech() {
  spokenIndex = -2;
  if (speech) speech.cancel();
}
function renderTime(force = false) {
  $("clock").textContent = format(elapsed);
  $("seek").value = elapsed;
  let index = -1;
  for (let i = 0; i < entries.length; i++) {
    if (entries[i].time <= elapsed) index = i;
    else break;
  }
  // 終了時は暗記モードでも最後の行を表示する。
  const finishedChanged = $("reader").classList.contains("finished") !== (elapsed >= duration);
  if (force || index !== active || finishedChanged) {
    active = index;
    const blind = $("blind").checked;
    const previous = visibleIndex();
    $("reader").classList.toggle("blind", blind);
    $("reader").classList.toggle("finished", elapsed >= duration);
    $("modeHint").textContent = blind
      ? "暗記モード：表示は1つ前の行だけ。今の内容を思い出して話してください。"
      : "青い行が現在の原稿です。行をタップすると、その時刻へ移動します。";
    nodes.forEach((node, i) => {
      node.classList.toggle("active", i === active);
      node.classList.toggle("past", i < active);
      node.classList.toggle("previous", blind && i === previous);
      node.tabIndex = blind ? -1 : 0;
      if (blind) node.removeAttribute("role");
      else node.setAttribute("role", "button");
      if (!blind && i === active) node.setAttribute("aria-current", "true");
      else node.removeAttribute("aria-current");
      node.querySelector(".stamp").textContent =
        (blind ? "1つ前の内容 · " : "") + format(entries[i].time);
    });
    if (blindHint) {
      blindHint.hidden = !blind || previous >= 0;
      blindHint.textContent = active < 0
        ? "開始時刻まで待機しています。"
        : "最初の内容を思い出してください。";
    }
    centerLine(!force);
  }
  if (!useAudio && playing && $("tts").checked && active >= 0 && active !== spokenIndex) {
    spokenIndex = active;
    speakText(entries[active].text);
  }
}
async function acquireWake() {
  if (!("wakeLock" in navigator) || !playing || document.hidden || wake || wakePending) return;
  wakePending = true;
  try {
    const lock = await navigator.wakeLock.request("screen");
    if (!playing || document.hidden) {
      await lock.release();
      return;
    }
    wake = lock;
    lock.addEventListener("release", () => { if (wake === lock) wake = null; });
  } catch {
    message("画面消灯防止を利用できません。端末の画面タイムアウト設定を確認してください。");
  } finally { wakePending = false; }
}
function releaseWake() {
  const lock = wake;
  wake = null;
  if (lock) lock.release().catch(() => {});
}
function syncTime(now = performance.now()) {
  if (playing) {
    if (useAudio && !audio.paused && !audio.ended) {
      elapsed = Math.min(duration, audio.currentTime);
    } else {
      elapsed = Math.min(duration, elapsed + (now - lastTick) / 1000 * playbackSpeed);
    }
  }
  lastTick = now;
}
function pause(silence = true) {
  syncTime();
  if (silence) stopSpeech();
  audio.pause();
  segmentEnd = null;
  playing = false;
  cancelAnimationFrame(raf);
  $("play").textContent = "▶ 再生";
  releaseWake();
  renderTime();
}
function tick(now) {
  if (!playing) return;
  syncTime(now);
  renderTime();
  if (elapsed >= duration) {
    pause(false);
    message("読み上げ終了です。");
    return;
  }
  raf = requestAnimationFrame(tick);
}
function start() {
  if (!entries.length) return;
  if (elapsed >= duration) elapsed = 0;
  playing = true;
  lastTick = performance.now();
  if (useAudio) {
    segmentEnd = null;
    audio.muted = !$("tts").checked;
    audio.playbackRate = playbackSpeed;
    audio.currentTime = elapsed;
    audio.play().catch(() => message("音声を再生できませんでした。"));
  }
  $("play").textContent = "❚❚ 一時停止";
  message($("blind").checked
    ? "暗記練習中。現在の行は非表示です。"
    : "再生中。時間に合わせて自動スクロールします。");
  acquireWake();
  renderTime(true);
  raf = requestAnimationFrame(tick);
}
function jump(time) {
  if (playing) stopSpeech();
  elapsed = Math.max(0, Math.min(duration, time));
  lastTick = performance.now();
  if (useAudio) {
    if (!playing) { audio.pause(); segmentEnd = null; }
    audio.currentTime = elapsed;
    if (playing && elapsed < audio.duration) audio.play().catch(() => {});
  }
  renderTime(true);
}
function playSegment(index) {
  // 停止中に1行だけ録音音声で聞く
  audio.muted = false;
  audio.playbackRate = playbackSpeed;
  audio.currentTime = entries[index].time;
  segmentEnd = index + 1 < entries.length ? entries[index + 1].time : null;
  audio.play().catch(() => {});
}
function apply(text, persist = true) {
  // 本文が録音音声と同じなら、時刻は音声に合わせたものを使う
  if (matchesAudio(text)) {
    text = audioScript;
    $("source").value = text;
  }
  const parsed = parseLrc(text);
  const lines = parsed.filter(item => item.text);
  if (!lines.length) {
    message("時刻付きの原稿がありません。[00:00.00]本文 の形式で入力してください。");
    return false;
  }
  pause();
  entries = lines;
  const last = parsed[parsed.length - 1];
  duration = last.text ? last.time + 5 : last.time;
  duration = Math.max(duration, entries[entries.length - 1].time + 0.1);
  elapsed = 0;
  active = -2;
  $("seek").max = duration;
  $("total").textContent = format(duration);
  $("reader").replaceChildren();
  blindHint = document.createElement("div");
  blindHint.id = "blindHint";
  blindHint.hidden = true;
  $("reader").appendChild(blindHint);
  nodes = entries.map((entry, index) => {
    const node = document.createElement("div");
    node.className = "line";
    const stamp = document.createElement("span");
    stamp.className = "stamp";
    const body = document.createElement("span");
    body.textContent = entry.text;
    node.append(stamp, body);
    node.addEventListener("click", () => {
      if (!$("blind").checked) jump(entries[index].time);
    });
    node.addEventListener("keydown", event => {
      if (!$("blind").checked && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        jump(entries[index].time);
      }
    });
    $("reader").appendChild(node);
    return node;
  });
  if (persist) save();
  renderTime(true);
  useAudio = audioReady && matchesAudio(text);
  message(`${entries.length}行・終了時刻 ${format(duration)}。` +
    (useAudio ? "録音音声（Gemini TTS）を使います。" :
      audioScript ? "本文が録音音声と異なるため、端末の読み上げを使います。" : "") +
    (storageAvailable ? "原稿はこのブラウザに保存されます。" :
      "自動保存できません。LRCを保存してください。"));
  return true;
}
function setFont() {
  document.documentElement.style.setProperty("--font-size", $("font").value + "px");
  $("fontValue").textContent = $("font").value;
  centerLine(false);
}

$("play").addEventListener("click", () => playing ? pause() : start());
$("reset").addEventListener("click", () => {
  pause(); jump(0); message("先頭に戻しました。");
});
$("back").addEventListener("click", () => {
  syncTime(); jump(elapsed - 10);
});
$("seek").addEventListener("input", () => jump(Number($("seek").value)));
$("speed").addEventListener("change", () => {
  syncTime();
  playbackSpeed = Number($("speed").value);
  save(); renderTime();
});
$("speed").addEventListener("change", () => { audio.playbackRate = playbackSpeed; });
$("tts").addEventListener("change", () => {
  if (useAudio) audio.muted = !$("tts").checked;
  else if ($("tts").checked) { spokenIndex = -2; renderTime(); }
  else stopSpeech();
  save();
  message($("tts").checked ? "音声ON" : "音声OFF（画面だけ進みます）");
});
$("speakNow").addEventListener("click", () => {
  // 暗記モードで詰まったときのヒントにも使える
  const index = Math.max(0, Math.min(active, entries.length - 1));
  if (!entries[index]) return;
  if (!useAudio) speakText(entries[index].text);
  else if (!playing) playSegment(index);
  else if (!$("tts").checked) speakText(entries[index].text);
});
audio.addEventListener("timeupdate", () => {
  if (!playing && segmentEnd !== null && audio.currentTime >= segmentEnd) {
    audio.pause();
    segmentEnd = null;
  }
});
$("voice").addEventListener("change", () => {
  savedVoice = $("voice").value;
  save();
  speakText("この声で読み上げます。");
});
$("blind").addEventListener("change", () => {
  syncTime();
  renderTime(true);
  save();
  message($("blind").checked
    ? "暗記モード：現在の行以降を隠し、直前の1行だけ表示します。"
    : "通常モードに戻しました。");
});
$("font").addEventListener("input", () => { setFont(); save(); });
$("mirror").addEventListener("change", () => {
  $("reader").classList.toggle("mirror", $("mirror").checked);
  save();
});
$("center").addEventListener("click", () => centerLine());
$("apply").addEventListener("click", () => {
  if (apply($("source").value)) {
    $("editorDetails").open = false;
    requestAnimationFrame(() => centerLine(false));
  }
});
$("source").addEventListener("input", save);
$("sample").addEventListener("click", () => {
  if (!audioScript) { message("音声付き原稿を読み込めていません。"); return; }
  if (!confirm("編集中の原稿を、音声付きの原稿に置き換えますか？")) return;
  $("source").value = audioScript;
  apply(audioScript);
});
$("file").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    $("source").value = text;
    if (apply(text)) {
      $("editorDetails").open = false;
      requestAnimationFrame(() => centerLine(false));
    }
  } catch { message("ファイルを読み込めませんでした。"); }
  event.target.value = "";
});
$("download").addEventListener("click", () => {
  const blob = new Blob(
    [$("source").value.replace(/\r?\n/g, "\r\n")],
    { type: "text/plain;charset=utf-8" }
  );
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "joa2026.lrc";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
});
$("fullscreen").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else message("このブラウザは全画面表示に対応していません。");
  } catch { message("全画面表示に切り替えられませんでした。"); }
});
document.addEventListener("fullscreenchange", () => {
  $("fullscreen").textContent = document.fullscreenElement ? "全画面解除" : "全画面";
  requestAnimationFrame(() => centerLine(false));
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && playing) acquireWake();
});
window.addEventListener("resize", () => centerLine(false));
$("editorDetails").addEventListener("toggle", () => {
  requestAnimationFrame(() => centerLine(false));
});

const state = saved();
if (state.font && Number(state.font) >= 20 && Number(state.font) <= 60) {
  $("font").value = state.font;
}
if ([...$("speed").options].some(option => option.value === state.speed)) {
  $("speed").value = state.speed;
}
playbackSpeed = Number($("speed").value);
$("mirror").checked = !!state.mirror;
$("blind").checked = !!state.blind;
$("tts").checked = state.sound !== false;
savedVoice = typeof state.voice === "string" ? state.voice : "";
if (speech) {
  loadVoices();
  speech.addEventListener("voiceschanged", loadVoices);
} else {
  document.querySelectorAll(".tts-only").forEach(el => { el.hidden = true; });
}
$("reader").classList.toggle("mirror", $("mirror").checked);
setFont();
$("source").value = typeof state.source === "string" ? state.source : "";

async function init() {
  try {
    const response = await fetch(SCRIPT_URL);
    if (response.ok) audioScript = await response.text();
  } catch { /* オフラインで未キャッシュ */ }
  if (!$("source").value.trim()) $("source").value = audioScript;
  if (!apply($("source").value, false)) $("editorDetails").open = true;
  if (!audioScript) return;
  try {
    // Blob にしておくと、シークやオフライン再生が Range リクエストに左右されない
    const response = await fetch(AUDIO_URL);
    if (!response.ok) throw new Error(response.status);
    audio.src = URL.createObjectURL(await response.blob());
    audio.preload = "auto";
    audioReady = true;
    if (!playing) apply($("source").value, false);
  } catch {
    message("録音音声を読み込めませんでした。端末の読み上げを使います。");
  }
}
init();

// オフラインでも使えるよう、他のアプリと共通の Service Worker を登録する
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/android_app/sw.js", { scope: "/android_app/" }).catch(() => {});
  });
}
</script>
