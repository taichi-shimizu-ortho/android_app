<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="滑膜由来MSC継代プロトコル">
  <meta name="theme-color" content="#2196F3">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/android_app/shared/icons/icon-192x192.png">
  <title>MSC継代プロトコル</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      padding: 30px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #step-container {
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    .step-header {
      border-bottom: 3px solid #667eea;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .step-header h1 {
      font-size: 1.5em;
      color: #333;
      margin-bottom: 5px;
    }

    .step-counter {
      color: #667eea;
      font-weight: bold;
      font-size: 0.9em;
    }

    .step-content {
      flex: 1;
      margin-bottom: 20px;
    }

    .step-content h2 {
      font-size: 1.2em;
      color: #555;
      margin-bottom: 10px;
    }

    .step-content p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .description {
      background: #f5f5f5;
      padding: 12px;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      margin: 10px 0;
    }

    .notes {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
      color: #856404;
    }

    .timer-section {
      background: #f0f4ff;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      border: 2px solid #667eea;
    }

    .timer-display {
      font-size: 3em;
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .timer-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .timer-buttons button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      background: #667eea;
      color: white;
      font-weight: bold;
    }

    .timer-buttons button:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .timer-buttons button:active {
      transform: translateY(0);
    }

    .step-progress {
      text-align: center;
      color: #999;
      font-size: 0.9em;
      margin-bottom: 20px;
    }

    .navigation-buttons {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .navigation-buttons button {
      flex: 1;
      padding: 15px;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      background: #667eea;
      color: white;
      font-weight: bold;
    }

    .navigation-buttons button:hover:not(:disabled) {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .navigation-buttons button:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .navigation-buttons button:active:not(:disabled) {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      .step-header h1 {
        font-size: 1.2em;
      }

      .timer-display {
        font-size: 2.5em;
      }

      .navigation-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="step-container">
      <p>読み込み中...</p>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
