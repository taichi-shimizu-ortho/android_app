<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="滑膜由来MSC継代プロトコル">
  <meta name="theme-color" content="#2196F3">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="/android_app/protocol/icons/icon-192.png">
  <title>MSC継代プロトコル</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      padding: 30px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #step-container {
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      border-bottom: 3px solid #667eea;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .section-header h1 {
      font-size: 1.5em;
      color: #333;
      margin-bottom: 5px;
    }

    .steps-list {
      flex: 1;
      margin-bottom: 20px;
    }

    .step-item {
      background: #f9f9f9;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .step-item h3 {
      font-size: 1.1em;
      color: #333;
      margin-bottom: 8px;
    }

    .step-item p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .description {
      background: #f5f5f5;
      padding: 12px;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      margin: 10px 0;
    }

    .notes {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
      color: #856404;
    }

    .timer-section {
      background: #f0f4ff;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      border: 2px solid #667eea;
    }

    .timer-display {
      font-size: 3em;
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .timer-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .timer-buttons button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      background: #667eea;
      color: white;
      font-weight: bold;
    }

    .timer-buttons button:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .timer-buttons button:active {
      transform: translateY(0);
    }

    .section-progress {
      text-align: center;
      color: #999;
      font-size: 0.9em;
      margin-bottom: 20px;
    }

    .timer-label {
      text-align: center;
      color: #667eea;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 0.95em;
    }

    .elapsed-time {
      text-align: center;
      color: #999;
      font-size: 0.85em;
      margin: 5px 0 10px 0;
      font-family: 'Courier New', monospace;
    }

    .calculator-section {
      background: #f0f4ff;
      border: 2px solid #667eea;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }

    .calculator-section h3 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .calculator-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      color: #555;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9em;
    }

    .form-group input,
    .form-group textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1em;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .calculate-btn, .save-btn {
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .calculate-btn:hover, .save-btn:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .result-display {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      padding: 15px;
      border-radius: 4px;
      margin-top: 10px;
    }

    .result-display p {
      color: #2e7d32;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1em;
    }

    .volume-result {
      background: #fff9c4;
      color: #f57f17;
      padding: 10px;
      border-radius: 4px;
      font-size: 1.1em !important;
    }

    .save-btn {
      background: #4caf50;
      margin-top: 10px;
    }

    .save-btn:hover {
      background: #45a049;
    }

    .navigation-buttons {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .navigation-buttons button {
      flex: 1;
      padding: 15px;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      background: #667eea;
      color: white;
      font-weight: bold;
    }

    .navigation-buttons button:hover:not(:disabled) {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .navigation-buttons button:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .navigation-buttons button:active:not(:disabled) {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      .step-header h1 {
        font-size: 1.2em;
      }

      .timer-display {
        font-size: 2.5em;
      }

      .navigation-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="step-container">
      <p>読み込み中...</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
